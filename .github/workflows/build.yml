name: Build & Release

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Verify Swift Toolchain
        run: |
          swift --version
          which swiftc

      - name: Build Application Bundle
        run: |
          chmod +x scripts/*.sh
          ./scripts/build.sh

      - name: Package DMG Installer
        run: |
          ./scripts/package_dmg.sh

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Kimi-Installer-macOS
          path: dist/*.dmg

      - name: Publish Release Assets
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
